# Mounted read-only into the container at /etc/atlantis/repos.yaml
# (path set via ATLANTIS_REPO_CONFIG in .env).

repos:
  - id: "/.*/"
    allow_custom_workflows: true
    allowed_overrides: [workflow, apply_requirements, delete_source_branch_on_merge]
    apply_requirements: [approved]
    workflow: terragrunt

workflows:
  terragrunt:
    plan:
      steps:
        - env:
            name: TF_IN_AUTOMATION
            value: "true"
        - env:
            name: TG_TF_PATH
            value: "tofu"
        - run: find . -type d -name .terragrunt-cache -prune -exec rm -rf {} +
        - run: terragrunt run -- init -input=false
        - run:
            command: terragrunt run -- plan -input=false -out=$PLANFILE
            output: strip_refreshing
    apply:
      steps:
        - env:
            name: TG_TF_PATH
            value: "tofu"
        - run: terragrunt run -- apply $PLANFILE
