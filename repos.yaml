# Mounted read-only into the container at /etc/atlantis/repos.yaml
# (path set via ATLANTIS_REPO_CONFIG in .env).

repos:
  - id: "/.*/"
    allow_custom_workflows: true
    allowed_overrides: [workflow, apply_requirements, delete_source_branch_on_merge]
    apply_requirements: [approved, mergeable]
    # Every repo defaults to the terragrunt workflow below unless its own
    # atlantis.yaml overrides "workflow:" for a specific project.
    workflow: terragrunt

workflows:
  # For repos that use plain OpenTofu with no Terragrunt: Atlantis's
  # built-in plan/apply steps already work, driven by
  # ATLANTIS_DEFAULT_TF_DISTRIBUTION=opentofu in .env. No custom workflow
  # needed for those; this repos.yaml only has to define the Terragrunt path.

  terragrunt:
    plan:
      steps:
        - env:
            name: TF_IN_AUTOMATION
            value: "true"
        - env:
            # Tells Terragrunt to invoke the "tofu" binary instead of
            # "terraform" for every OpenTofu/Terraform call it makes.
            name: TERRAGRUNT_TFPATH
            value: "tofu"
        - run: find . -type d -name .terragrunt-cache -prune -exec rm -rf {} +
        - run: terragrunt run -- init -input=false
        - run:
            command: terragrunt run -- plan -input=false -out=$PLANFILE
            output: strip_refreshing
    apply:
      steps:
        - env:
            name: TERRAGRUNT_TFPATH
            value: "tofu"
        - run: terragrunt run -- apply $PLANFILE
